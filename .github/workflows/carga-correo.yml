name: Carga automática desde correo

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos
  workflow_dispatch:          # botón «Run workflow» para lanzarlo a mano

concurrency:
  group: carga-correo
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automatico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automatico/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node index.mjs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AVISO_EMAILS: ${{ secrets.AVISO_EMAILS }}
          APP_URL: https://yulissalopezc.github.io/control-existencias-prueba/
